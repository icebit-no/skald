[package]
name = "skald-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# GPUI through gpui-kit at the revision skald-overlay takes, with its component library and icons left out.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "1e7ffaa6d1c0c230cb84099584e6c057531d5a5d", version = "=0.7.1", default-features = false }

# Puts a window above the app in front even when macOS does not let Skald become the active app, and finds
# GPUI's NSWindow for it. These versions are in the tree already through skald-overlay.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
raw-window-handle = "=0.6.2"
