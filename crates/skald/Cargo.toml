[package]
name = "skald"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
skald-audio.workspace = true
skald-control.workspace = true
skald-core.workspace = true
skald-engine.workspace = true
skald-input.workspace = true
