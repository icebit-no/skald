[package]
name = "skald"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
skald-audio.workspace = true
skald-bench = { path = "../skald-bench" }
skald-control.workspace = true
skald-core.workspace = true
skald-engine.workspace = true
skald-input.workspace = true
skald-models.workspace = true

# Reads a WAV file for `skald transcribe`; already in the tree for skald-engine's tests.
hound = "=3.5.1"

[target.'cfg(unix)'.dependencies]
# sigaction, for Ctrl-C and the other signals that end the loop; already in the tree through cpal.
libc = "=0.2.191"

# The app's screen: the overlay, the menu bar item and the settings window, on GPUI.
[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
skald-firstrun = { path = "../skald-firstrun" }
skald-overlay = { path = "../skald-overlay" }
skald-settings = { path = "../skald-settings" }
skald-tray.workspace = true
# GPUI at the revision the overlay and the settings window take: the application, its run loop and
# tasks, the clipboard.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "1e7ffaa6d1c0c230cb84099584e6c057531d5a5d", version = "=0.7.1", default-features = false }
# Carries the loop's events, the menu's actions and download progress to tasks on GPUI's main thread;
# already in the tree through GPUI.
async-channel = "=2.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
# SMAppService for start at login and AVFoundation's microphone request, through the Objective-C runtime,
# the request's completion block with block2; all in the tree through skald-input and skald-overlay.
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }

# The console, which a command attaches to and whose Ctrl-C and close end the loop as the signals do on
# Unix, and the Run key for start at login. This version is in the tree through skald-models.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Registry",
] }
