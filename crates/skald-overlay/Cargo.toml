[package]
name = "skald-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# GPUI through gpui-kit, taken the way Ferric takes it: from git, pinned to one revision. Only GPUI itself
# is used; the component library and its icons are left out.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "1e7ffaa6d1c0c230cb84099584e6c057531d5a5d", version = "=0.7.1", default-features = false }
skald-core.workspace = true
# Only to hand GPUI the plates' pictures as an `image` frame, the type its images take; GPUI already
# depends on this version, so it adds nothing to the tree.
image = { version = "=0.25.10", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# What GPUI leaves to AppKit: clicks through the window, its shadow, the active screen, the accent
# colour, reduced motion and the shape of the blurred background. These versions are in the tree already.
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSAccessibility",
    "NSBezierPath",
    "NSColor",
    "NSColorSpace",
    "NSGraphics",
    "NSImage",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSGeometry",
    "NSString",
    "NSValue",
] }
# GPUI hands out its native window through this crate's handle.
raw-window-handle = "=0.6.2"

# What GPUI leaves to Windows: clicks through the window, the active screen, the accent colour, the
# animation setting and the shape of the acrylic. These versions are in the tree already.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
