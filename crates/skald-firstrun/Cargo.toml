[package]
name = "skald-firstrun"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# GPUI through gpui-kit at the revision skald-overlay takes. Only GPUI and two of its headless controls
# (`gpui_kit::base`: the button and the progress bar) are used; the styled component library and its
# icons are left out.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "1e7ffaa6d1c0c230cb84099584e6c057531d5a5d", version = "=0.7.1", default-features = false }
# The hold key's name for the test's instruction.
skald-core.workspace = true
# The model's name, size, licence and credit, and the download's status, events and errors.
skald-models.workspace = true
