[package]
name = "skald-input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
handy-keys = "=0.3.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSPasteboard",
    "NSPasteboardItem",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CFMachPort",
] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSString",
    "NSValue",
] }

# The GlobalShortcuts portal over D-Bus. GPUI takes the same version with the same executor, so only the
# shortcuts' feature is new.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
# Runs the portal's futures on a thread of its own and merges its two signals; in the tree through zbus.
futures-lite = { version = "=2.6.1", default-features = false, features = ["std"] }
