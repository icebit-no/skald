name: linux

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    # GitHub's own runner, as for macOS in rust.yml: the repository is public, so a pull request from a
    # fork never reaches a machine of ours. Formatting is the same on every system and is checked there.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: linux-${{ github.head_ref || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The system libraries the crates link: ALSA for cpal; Wayland, xkbcommon, X11's xcb and fontconfig
      # for GPUI; the Vulkan and SPIR-V headers, the Vulkan loader and glslc for its shaders, for
      # transcribe.cpp's Vulkan backend. The runner already has the C++ compiler and cmake. It has no GPU, so the tests compute on
      # the CPU.
      # Insertion is tried on a headless sway, which has the data-control and virtual-keyboard protocols,
      # with wl-clipboard and wev to look at what Skald does and wtype to send its Ctrl+V.
      - run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev
          libvulkan-dev spirv-headers glslc sway wl-clipboard wtype wev
      # rustup installs the toolchain rust-toolchain.toml pins on the first cargo call.
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: cargo test insertion on a headless sway
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          printf 'output HEADLESS-1 resolution 1280x720\n' > "$RUNNER_TEMP/sway.conf"
          WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 \
            sway -c "$RUNNER_TEMP/sway.conf" > "$RUNNER_TEMP/sway.log" 2>&1 &
          for _ in $(seq 50); do
            socket=$(ls "$XDG_RUNTIME_DIR" | grep -m1 -x 'wayland-[0-9]*') && break
            sleep 0.1
          done
          WAYLAND_DISPLAY="$socket" cargo test -p skald-input --locked --test wayland -- --ignored
