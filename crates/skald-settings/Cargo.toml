[package]
name = "skald-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# GPUI through gpui-kit at the revision skald-overlay takes. Only GPUI and its headless controls
# (`gpui_kit::base`: the text input, switch and checkbox) are used; the styled component library and its
# icons are left out.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "1e7ffaa6d1c0c230cb84099584e6c057531d5a5d", version = "=0.7.1", default-features = false }
skald-core.workspace = true
# The models Skald offers, with their licences and credits, and the names of what is on disk.
skald-models = { path = "../skald-models" }
# The identity's colours in light and dark mode, and gpui-kit set up once.
skald-ui = { path = "../skald-ui" }
