# Reads a WAV file for `skald transcribe`; already in the tree for skald-engine's tests.
hound = "=3.5.1"

[target.'cfg(unix)'.dependencies]
# sigaction, for Ctrl-C and the other signals that end the loop; already in the tree through cpal.
libc = "=0.2.191"
