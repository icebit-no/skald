name: windows

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows:
    # GitHub's own runner, as for macOS. Formatting is checked in the macOS job alone; it does not depend on
    # the system. transcribe.cpp builds for the CPU here, with MSVC and the runner's CMake.
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: windows-${{ github.head_ref || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # The runner's Git turns line endings into CRLF on checkout; the files Skald embeds and the tests that
      # read them expect the repository's bytes.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup installs the toolchain rust-toolchain.toml pins on the first cargo call.
      - run: cargo clippy --workspace --all-targets --locked
      # Every crate's tests run even when one fails, so a run on this system shows all it breaks.
      - run: cargo test --workspace --locked --no-fail-fast
      # The clipboard tests use the system clipboard, which Windows has one of, so they are left out of a
      # developer's runs and run here alone.
      - run: cargo test -p skald-input --locked -- --ignored --test-threads 1
