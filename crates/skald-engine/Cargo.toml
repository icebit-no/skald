[package]
name = "skald-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
skald-core.workspace = true
# transcribe.cpp's own binding (D-22). The sys crate is Skald's patched copy (see the root Cargo.toml).
# The metal feature builds the Metal backend on Apple and nothing elsewhere.
transcribe-cpp = { version = "=0.5.1", default-features = false, features = ["metal"] }
transcribe-cpp-sys = { version = "=0.5.1", default-features = false }

# On Windows the backends are modules loaded at run time, so a machine without a Vulkan driver still starts
# and computes on the CPU (D-40). The Vulkan SDK is needed to build them.
[target.'cfg(windows)'.dependencies]
transcribe-cpp = { version = "=0.5.1", default-features = false, features = ["vulkan", "dynamic-backends"] }

[dev-dependencies]
hound = "=3.5.1"
